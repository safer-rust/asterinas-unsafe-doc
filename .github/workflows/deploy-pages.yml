name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Asterinas
        uses: actions/checkout@v4
        with:
          repository: asterinas/asterinas
          path: asterinas-src
          fetch-depth: 1

      - name: Generate latest asterinas report
        run: |
          python3 unsafe_doc_generator.py \
            --local-dir asterinas-src \
            --remote-repo-url https://github.com/asterinas/asterinas \
            --remote-ref "$(git -C asterinas-src rev-parse HEAD)" \
            --output-dir docs
          git -C asterinas-src rev-parse HEAD > docs/latest_commit.txt
          rm -rf asterinas-src

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and push updated docs
        run: |
          git config --global user.email 'action@github.com'
          git config --global user.name 'GitHub Action'
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@github.com/safer-rust/asterinas-unsafe-doc.git
          git add -A docs/
          git commit -m 'Update docs [ci skip]' || echo 'No changes to commit'
          git pull --rebase origin main
          git push
